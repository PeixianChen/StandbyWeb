<!doctype html>

  <head>

  <body>
    <div class="phone">
      <header class="topbar">
        <a class="topbar-logo" href="#top" aria-label="返回顶部">Stand<i>:</i>by</a>

        <button class="show-dialog-close" type="button" aria-label="关闭">×</button>
        <img class="show-dialog-image" alt="" />

          <h3 id="show-dialog-title" data-dialog-title></h3>
